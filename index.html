<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>3D 超空間星空</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px; /* 建立 3D 透視 */
        }

        .star-container {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: rotate 100s linear infinite;
        }

        /* 旋轉動畫，讓整個星雲轉動 */
        @keyframes rotate {
            from { transform: rotateY(0deg) rotateX(0deg); }
            to { transform: rotateY(360deg) rotateX(360deg); }
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.8;
            /* 讓星星發光 */
            box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.5);
        }

        /* 讓星星閃爍的動畫 */
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="star-container" id="container"></div>

    <script>
        // 雖然是 CSS 效果，但我們用 JS 快速產生 500 顆星星，免去手寫 500 行 HTML
        const container = document.getElementById('container');
        const starCount = 500;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            
            // 隨機大小
            const size = Math.random() * 3 + 'px';
            star.style.width = size;
            star.style.height = size;

            // 隨機 3D 位置 (X, Y, Z 軸)
            const x = (Math.random() - 0.5) * 2000;
            const y = (Math.random() - 0.5) * 2000;
            const z = (Math.random() - 0.5) * 2000;
            
            star.style.transform = `translate3d(${x}px, ${y}px, ${z}px)`;

            // 隨機閃爍速度
            const delay = Math.random() * 5 + 's';
            const duration = Math.random() * 3 + 2 + 's';
            star.style.animation = `twinkle ${duration} infinite ease-in-out ${delay}`;

            container.appendChild(star);
        }
    </script>
</body>
</html>
