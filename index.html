<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>極致璀璨星空特效</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* 防止出現滾動條 */
            background-color: #050505; /* 深黑底色 */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="starCanvas"></canvas>

    <script>
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, stars = [];
        const starCount = 400; // 星星數量
        const mouse = { x: null, y: null, radius: 100 };

        // 初始化畫布大小
        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        // 星星物件建構子
        class Star {
            constructor() {
                this.init();
            }

            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 1.5 + 0.5; // 星星大小
                this.baseOpacity = Math.random() * 0.5 + 0.3; // 基礎亮度
                this.opacity = this.baseOpacity;
                this.speed = Math.random() * 0.05; // 閃爍速度
                this.angle = Math.random() * Math.PI * 2;
                
                // 為了滑鼠互動紀錄原始位置
                this.baseX = this.x;
                this.baseY = this.y;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
            }

            update() {
                // 1. 閃爍邏輯
                this.angle += this.speed;
                this.opacity = this.baseOpacity + Math.sin(this.angle) * 0.3;

                // 2. 滑鼠互動 (躲避效果)
                if (mouse.x !== null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < mouse.radius) {
                        let force = (mouse.radius - distance) / mouse.radius;
                        let directionX = dx / distance;
                        let directionY = dy / distance;
                        this.x -= directionX * force * 5;
                        this.y -= directionY * force * 5;
                    } else {
                        // 緩慢回到原始位置
                        if (this.x !== this.baseX) {
                            let dx = this.x - this.baseX;
                            this.x -= dx / 20;
                        }
                        if (this.y !== this.baseY) {
                            let dy = this.y - this.baseY;
                            this.y -= dy / 20;
                        }
                    }
                }
                
                this.draw();
            }
        }

        // 建立星群
        function createStars() {
            stars = [];
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }
        }

        // 動畫迴圈
        function animate() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(star => star.update());
            requestAnimationFrame(animate);
        }

        // 事件監聽
        window.addEventListener('resize', () => {
            initCanvas();
            createStars();
        });

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });

        // 啟動
        initCanvas();
        createStars();
        animate();
    </script>
</body>
</html>
